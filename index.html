                              <a 
                                href={`https://api.whatsapp.com/send?text=${encodeURIComponent(getPersonalizedWAMessage(guest))}`}
                                target="_blank"
                                rel="noreferrer"
                                className="p-1.5 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-slate-950 rounded-lg transition"
                                title="Kirim Langsung via WA"
                              >
                                <ExternalLink className="w-3.5 h-3.5" />
                              </a>

                              <button 
                                onClick={() => setSavedGuests(savedGuests.filter((_, i) => i !== idx))}
                                className="p-1.5 text-slate-500 hover:text-rose-400 rounded-lg transition"
                                title="Hapus"
                              >
                                <Trash2 className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-4 text-center">
                    <div className="flex justify-center p-3 bg-white rounded-xl w-40 h-40 mx-auto">
                      <img 
                        src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://inviteai.app/v/${event.id}`} 
                        alt="QR Code" 
                        className="w-full h-full"
                      />
                    </div>
                    <p className="text-xs text-slate-400">Scan untuk langsung membuka undangan digital umum ini.</p>
                  </div>

                  <div className="space-y-3">
                    <label className="text-xs font-semibold text-slate-300">Draf Pesan WhatsApp Umum (Broadcast Group)</label>
                    <textarea 
                      rows="5"
                      readOnly
                      value={generateAICopywriting(event.eventType, '', 'broadcastWA')}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-slate-300"
                    />
                    <button 
                      onClick={() => {
                        navigator.clipboard.writeText(generateAICopywriting(event.eventType, '', 'broadcastWA'));
                        showToast("Teks WhatsApp disalin!");
                      }}
                      className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-slate-950 rounded-xl text-xs transition flex items-center justify-center gap-2"
                    >
                      <Copy className="w-4 h-4" />
                      Salin Teks Broadcast Umum WA
                    </button>
                  </div>
                </div>
              )}

            </div>

            <div className="p-4 border-t border-slate-800 bg-slate-900/80 flex items-center gap-3">
              <button 
                onClick={onViewPreview}
                className="flex-1 py-3 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-bold text-sm rounded-xl shadow-lg hover:brightness-110 transition flex items-center justify-center gap-2"
              >
                <Eye className="w-4 h-4" />
                Layar Penuh Undangan
              </button>
            </div>
          </div>

          {/* Realtime Live Frame Interactive Canvas */}
          <div className="flex-1 bg-slate-900 flex flex-col items-center justify-center p-4 lg:p-8 relative overflow-hidden">
            
            <div className="absolute top-4 left-1/2 -translate-x-1/2 z-20 bg-slate-950/80 backdrop-blur border border-slate-800 p-1 rounded-xl flex items-center gap-1 shadow-xl">
              <button 
                onClick={() => setViewDevice('mobile')}
                className={`p-2 rounded-lg text-xs font-medium flex items-center gap-1.5 transition ${viewDevice === 'mobile' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}
              >
                <Smartphone className="w-4 h-4" />
                Mobile Frame
              </button>
              <button 
                onClick={() => setViewDevice('desktop')}
                className={`p-2 rounded-lg text-xs font-medium flex items-center gap-1.5 transition ${viewDevice === 'desktop' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}
              >
                <Monitor className="w-4 h-4" />
                Responsive
              </button>
            </div>

            <div className={`w-full h-full flex items-center justify-center transition-all duration-300 pt-12 ${viewDevice === 'mobile' ? 'max-w-[390px] max-h-[780px]' : 'max-w-4xl max-h-[850px]'}`}>
              <div className="w-full h-full rounded-[38px] overflow-hidden border-[8px] border-slate-950 shadow-2xl relative flex flex-col bg-slate-950">
                <InvitationReaderView event={event} showToast={showToast} />
              </div>
            </div>

          </div>

        </div>
      );
    }

    function StandalonePreview({ event, onBack, showToast }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-950 flex flex-col">
          <div className="absolute top-4 left-4 z-50">
            <button 
              onClick={onBack}
              className="px-4 py-2 bg-slate-900/90 text-white hover:text-amber-400 border border-slate-700/80 rounded-xl backdrop-blur font-bold text-xs shadow-2xl flex items-center gap-2 transition"
            >
              <ArrowLeft className="w-4 h-4" /> Kembali ke Editor
            </button>
          </div>

          <div className="flex-1 w-full h-full overflow-hidden">
            <InvitationReaderView event={event} showToast={showToast} />
          </div>
        </div>
      );
    }

    function InvitationReaderView({ event, showToast }) {
      const theme = THEMES.find(t => t.id === event.themeId) || THEMES[0];
      const [isOpen, setIsOpen] = useState(false);
      const [isPlaying, setIsPlaying] = useState(false);
      
      const [activeGuest, setActiveGuest] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          return params.get('to') || params.get('guest') || 'Tamu Undangan';
        } catch (e) {
          return 'Tamu Undangan';
        }
      });

      const [rsvpState, setRsvpState] = useState(event.rsvps || []);
      const [guestbookState, setGuestbookState] = useState(event.guestbook || []);
      const [newGuestName, setNewGuestName] = useState('');
      const [newGuestMsg, setNewGuestMsg] = useState('');
      const [rsvpForm, setRsvpForm] = useState({ name: '', count: '1', status: 'Hadir', message: '' });
      const audioRef = useRef(null);

      const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

      useEffect(() => {
        const target = new Date(event.eventDate).getTime();
        const interval = setInterval(() => {
          const now = new Date().getTime();
          const difference = target - now;
          if (difference > 0) {
            setTimeLeft({
              days: Math.floor(difference / (1000 * 60 * 60 * 24)),
              hours: Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
              minutes: Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60)),
              seconds: Math.floor((difference % (1000 * 60)) / 1000),
            });
          }
        }, 1000);
        return () => clearInterval(interval);
      }, [event.eventDate]);

      const toggleMusic = () => {
        if (!audioRef.current) return;
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          audioRef.current.play().catch(() => {});
          setIsPlaying(true);
        }
      };

      const handleOpenInvitation = () => {
        setIsOpen(true);
        if (audioRef.current) {
          audioRef.current.play().then(() => setIsPlaying(true)).catch(() => {});
        }
      };

      const handleAddRSVP = (e) => {
        e.preventDefault();
        if (!rsvpForm.name) return;
        const newEntry = { id: Date.now(), name: rsvpForm.name, count: rsvpForm.count, status: rsvpForm.status, message: rsvpForm.message };
        setRsvpState([newEntry, ...rsvpState]);
        setRsvpForm({ name: '', count: '1', status: 'Hadir', message: '' });
        showToast("Konfirmasi RSVP terkirim!");
      };

      const handleAddGuestbook = (e) => {
        e.preventDefault();
        if (!newGuestName || !newGuestMsg) return;
        const newComment = { id: Date.now(), name: newGuestName, msg: newGuestMsg, likes: 0, date: 'Baru saja' };
        setGuestbookState([newComment, ...guestbookState]);
        setNewGuestName('');
        setNewGuestMsg('');
        showToast("Ucapan terkirim ke buku tamu!");
      };

      return (
        <div className={`w-full h-full overflow-y-auto relative ${theme.bg} ${theme.text} ${theme.font} transition-colors duration-500 selection:bg-amber-500 selection:text-black`}>
          
          <audio ref={audioRef} src={event.musicUrl} loop />

          {isOpen && (
            <button 
              onClick={toggleMusic}
              className="fixed bottom-6 right-6 z-40 p-3.5 bg-slate-950/80 backdrop-blur border border-amber-500/40 text-amber-400 rounded-full shadow-2xl animate-pulse"
            >
              {isPlaying ? <Volume2 className="w-5 h-5" /> : <VolumeX className="w-5 h-5" />}
            </button>
          )}

          {!isOpen ? (
            <div className="absolute inset-0 z-30 flex flex-col items-center justify-between p-8 text-center bg-slate-950 text-white overflow-hidden">
              <div className="absolute inset-0 opacity-40">
                <img src={event.coverImage} alt="Cover" className="w-full h-full object-cover" />
              </div>
              <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/80 to-slate-950/40" />

              <div className="relative z-10 pt-10 space-y-2">
                <span className="text-amber-400 text-xs tracking-widest uppercase font-semibold">Undangan Digital</span>
                <h1 className="text-3xl md:text-5xl font-extrabold tracking-tight text-white">{event.title}</h1>
              </div>

              <div className="relative z-10 space-y-6 max-w-sm">
                <div className="space-y-1">
                  <p className="text-xs text-slate-400 uppercase tracking-wider">Kepada Yth. Bapak/Ibu/Saudara/i:</p>
                  <h3 className="text-xl font-bold text-amber-300">{activeGuest}</h3>
                </div>

                <button 
                  onClick={handleOpenInvitation}
                  className="w-full py-3.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-bold rounded-2xl shadow-2xl hover:brightness-110 transition flex items-center justify-center gap-2 text-sm"
                >
                  <Heart className="w-4 h-4 fill-current" />
                  Buka Undangan
                </button>
              </div>

              <div className="relative z-10 pb-4 text-[10px] text-slate-500">
                Powered by InviteAI
              </div>
            </div>
          ) : (
            <div className="max-w-2xl mx-auto px-4 py-12 space-y-16">
              
              <section className="text-center space-y-6 pt-6">
                <div className="w-32 h-32 md:w-40 md:h-40 mx-auto rounded-full p-1 bg-gradient-to-tr from-amber-400 to-yellow-600 shadow-2xl overflow-hidden">
                  <img src={event.coverImage} alt="Hero" className="w-full h-full object-cover rounded-full" />
                </div>
                
                <div className="space-y-2">
                  <span className="text-amber-500 text-xs uppercase tracking-widest font-bold">The Celebration Of</span>
                  <h1 className="text-3xl md:text-5xl font-extrabold tracking-tight">{event.title}</h1>
                  <p className="text-xs opacity-80 max-w-md mx-auto italic">
                    "{event.welcomeQuote}"
                  </p>
                </div>
              </section>

              {event.eventType === 'Pernikahan' && (
                <section className="space-y-8 text-center">
                  <div className={`p-6 rounded-3xl ${theme.cardBg} border ${theme.border} shadow-xl space-y-6`}>
                    <div className="space-y-2">
                      <h3 className="text-2xl font-bold text-amber-400">{event.groom.name}</h3>
                      <p className="text-xs opacity-80">{event.groom.parents}</p>
                    </div>
                    <div className="text-amber-500 font-serif text-2xl font-bold">&</div>
                    <div className="space-y-2">
                      <h3 className="text-2xl font-bold text-amber-400">{event.bride.name}</h3>
                      <p className="text-xs opacity-80">{event.bride.parents}</p>
                    </div>
                  </div>
                </section>
              )}

              <section className={`p-6 rounded-3xl ${theme.cardBg} border ${theme.border} text-center space-y-4 shadow-xl`}>
                <h3 className="text-sm font-bold uppercase tracking-wider text-amber-400">Menghitung Hari</h3>
                <div className="grid grid-cols-4 gap-2">
                  {[
                    { label: 'Hari', val: timeLeft.days },
                    { label: 'Jam', val: timeLeft.hours },
                    { label: 'Menit', val: timeLeft.minutes },
                    { label: 'Detik', val: timeLeft.seconds },
                  ].map((item, idx) => (
                    <div key={idx} className="bg-slate-950/40 p-3 rounded-2xl border border-amber-500/20">
                      <span className="text-xl md:text-2xl font-black text-amber-400 block">{item.val}</span>
                      <span className="text-[10px] uppercase opacity-70">{item.label}</span>
                    </div>
                  ))}
                </div>
              </section>

              <section className={`p-6 rounded-3xl ${theme.cardBg} border ${theme.border} space-y-6 shadow-xl`}>
                <div className="text-center space-y-2">
                  <Calendar className="w-8 h-8 text-amber-400 mx-auto" />
                  <h3 className="text-xl font-bold">Waktu & Lokasi Acara</h3>
                  <p className="text-xs opacity-80">
                    {new Date(event.eventDate).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                  </p>
                </div>

                <div className="space-y-2 text-center border-t border-slate-700/50 pt-4">
                  <h4 className="font-bold text-amber-400 text-sm">{event.locationName}</h4>
                  <p className="text-xs opacity-80 leading-relaxed">{event.locationAddress}</p>
                </div>

                <div className="pt-2">
                  <a 
                    href={`https://maps.google.com/?q=${encodeURIComponent(event.locationName)}`} 
                    target="_blank" 
                    rel="noreferrer"
                    className="w-full py-3 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-bold rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg hover:brightness-110 transition"
                  >
                    <MapPin className="w-4 h-4" />
                    Buka di Google Maps
                  </a>
                </div>
              </section>

              <section className="space-y-4">
                <h3 className="text-center text-lg font-bold text-amber-400 flex items-center justify-center gap-2">
                  <Clock className="w-5 h-5" /> Susunan Acara
                </h3>
                <div className="space-y-3">
                  {event.rundown.map((item, i) => (
                    <div key={i} className={`p-4 rounded-2xl ${theme.cardBg} border ${theme.border} flex items-center justify-between`}>
                      <div>
                        <h4 className="font-bold text-sm">{item.title}</h4>
                        <p className="text-xs opacity-70">{item.desc}</p>
                      </div>
                      <span className="text-xs font-bold text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/30">
                        {item.time}
                      </span>
                    </div>
                  ))}
                </div>
              </section>

              <section className={`p-6 rounded-3xl ${theme.cardBg} border ${theme.border} space-y-4 shadow-xl`}>
                <h3 className="text-lg font-bold text-amber-400 text-center flex items-center justify-center gap-2">
                  <Users className="w-5 h-5" /> Konfirmasi Kehadiran (RSVP)
                </h3>

                <form onSubmit={handleAddRSVP} className="space-y-3">
                  <input 
                    type="text" 
                    placeholder="Nama Anda" 
                    required
                    value={rsvpForm.name}
                    onChange={e => setRsvpForm({ ...rsvpForm, name: e.target.value })}
                    className="w-full bg-slate-950/60 border border-slate-700/80 rounded-xl p-3 text-xs focus:outline-none focus:border-amber-400"
                  />
                  <div className="grid grid-cols-2 gap-3">
                    <select 
                      value={rsvpForm.count}
                      onChange={e => setRsvpForm({ ...rsvpForm, count: e.target.value })}
                      className="bg-slate-950/60 border border-slate-700/80 rounded-xl p-3 text-xs focus:outline-none focus:border-amber-400"
                    >
                      <option value="1">1 Orang</option>
                      <option value="2">2 Orang</option>
                      <option value="3">3+ Orang</option>
                    </select>
                    <select 
                      value={rsvpForm.status}
                      onChange={e => setRsvpForm({ ...rsvpForm, status: e.target.value })}
                      className="bg-slate-950/60 border border-slate-700/80 rounded-xl p-3 text-xs focus:outline-none focus:border-amber-400"
                    >
                      <option value="Hadir">Hadir</option>
                      <option value="Tidak Hadir">Tidak Hadir</option>
                    </select>
                  </div>
                  <textarea 
                    rows="2"
                    placeholder="Pesan / Catatan"
                    value={rsvpForm.message}
                    onChange={e => setRsvpForm({ ...rsvpForm, message: e.target.value })}
                    className="w-full bg-slate-950/60 border border-slate-700/80 rounded-xl p-3 text-xs focus:outline-none focus:border-amber-400"
                  />
                  <button 
                    type="submit"
                    className="w-full py-3 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-bold rounded-xl text-xs shadow-lg hover:brightness-110 transition flex items-center justify-center gap-2"
                  >
                    <Send className="w-4 h-4" /> Kirim Konfirmasi
                  </button>
                </form>

                <div className="pt-4 border-t border-slate-700/50 space-y-2">
                  <p className="text-xs font-bold text-amber-400">Daftar Kehadiran ({rsvpState.length}):</p>
                  <div className="max-h-36 overflow-y-auto space-y-2">
                    {rsvpState.map(item => (
                      <div key={item.id} className="p-2.5 bg-slate-950/40 rounded-xl text-xs flex items-center justify-between">
                        <div>
                          <span className="font-bold">{item.name}</span> ({item.count} Orang)
                          {item.message && <p className="text-[11px] opacity-70">{item.message}</p>}
                        </div>
                        <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${item.status === 'Hadir' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>
                          {item.status}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              {event.digitalEnvelope?.enabled && (
                <section className={`p-6 rounded-3xl ${theme.cardBg} border ${theme.border} space-y-4 shadow-xl text-center`}>
                  <Gift className="w-8 h-8 text-amber-400 mx-auto" />
                  <h3 className="text-lg font-bold">Amplop Digital & Hadiah</h3>
                  <p className="text-xs opacity-80">Doa restu Anda merupakan karunia terindah, namun jika ingin memberi tanda kasih dapat melalui:</p>

                  <div className="space-y-3 pt-2">
                    {event.digitalEnvelope.bankAccounts.map((acc, idx) => (
                      <div key={idx} className="p-4 bg-slate-950/40 rounded-2xl border border-slate-700/60 flex items-center justify-between">
                        <div className="text-left">
                          <span className="text-xs font-bold text-amber-400 block">{acc.bankName}</span>
                          <span className="text-sm font-mono tracking-wider font-bold">{acc.accountNumber}</span>
                          <span className="text-[10px] opacity-70 block">a.n {acc.accountName}</span>
                        </div>
                        <button 
                          onClick={() => {
                            navigator.clipboard.writeText(acc.accountNumber);
                            showToast(`Nomor rekening ${acc.bankName} disalin!`);
                          }}
                          className="p-2.5 bg-amber-500/10 hover:bg-amber-500 text-amber-400 hover:text-slate-950 rounded-xl border border-amber-500/30 transition"
                          title="Salin Rekening"
                        >
                          <Copy className="w-4 h-4" />
                        </button>
                      </div>
                    ))}
                  </div>
                </section>
              )}

              <section className={`p-6 rounded-3xl ${theme.cardBg} border ${theme.border} space-y-4 shadow-xl`}>
                <h3 className="text-lg font-bold text-amber-400 text-center flex items-center justify-center gap-2">
                  <MessageSquare className="w-5 h-5" /> Buku Ucapan & Doa Restu
                </h3>

                <form onSubmit={handleAddGuestbook} className="space-y-3">
                  <input 
                    type="text" 
                    placeholder="Nama Anda" 
                    required
                    value={newGuestName}
                    onChange={e => setNewGuestName(e.target.value)}
                    className="w-full bg-slate-950/60 border border-slate-700/80 rounded-xl p-3 text-xs focus:outline-none focus:border-amber-400"
                  />
                  <textarea 
                    rows="3"
                    placeholder="Tuliskan ucapan & doa restu Anda..."
                    required
                    value={newGuestMsg}
                    onChange={e => setNewGuestMsg(e.target.value)}
                    className="w-full bg-slate-950/60 border border-slate-700/80 rounded-xl p-3 text-xs focus:outline-none focus:border-amber-400"
                  />
                  <button 
                    type="submit"
                    className="w-full py-3 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-bold rounded-xl text-xs shadow-lg hover:brightness-110 transition flex items-center justify-center gap-2"
                  >
                    <Send className="w-4 h-4" /> Kirim Ucapan
                  </button>
                </form>

                <div className="space-y-3 pt-4 border-t border-slate-700/50">
                  {guestbookState.map(item => (
                    <div key={item.id} className="p-3 bg-slate-950/40 rounded-2xl border border-slate-800 text-xs space-y-1">
                      <div className="flex items-center justify-between">
                        <span className="font-bold text-amber-300">{item.name}</span>
                        <span className="text-[10px] opacity-50">{item.date}</span>
                      </div>
                      <p className="text-xs opacity-90 leading-relaxed">{item.msg}</p>
                    </div>
                  ))}
                </div>
              </section>

              <footer className="text-center pt-8 border-t border-slate-800 text-xs opacity-60 space-y-1">
                <p>Terima kasih atas doa & kehadiran Anda</p>
                <p className="font-bold text-amber-400">InviteAI Digital Invitation Superapp</p>
              </footer>

            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
